name: PHP Composer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
    - uses: actions/checkout@v4

    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        coverage: ${{ matrix.php == '8.4' && 'xdebug' || 'none' }}

    - name: Validate composer.json
      run: composer validate --strict

    - name: Install dependencies (runtime only on PHP < 8.2)
      run: composer update --prefer-dist --no-progress --no-interaction ${{ matrix.php < '8.2' && '--no-dev' || '' }}

    - name: Security audit
      run: composer audit

    - name: Lint sources
      run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

    - name: Smoke test (PHP < 8.2)
      if: ${{ matrix.php < '8.2' }}
      run: php tests/smoke.php

    - name: Run test suite
      if: ${{ matrix.php >= '8.2' && matrix.php != '8.4' }}
      run: composer run-script test

    - name: Run test suite with coverage
      if: ${{ matrix.php == '8.4' }}
      run: XDEBUG_MODE=coverage composer run-script test:coverage

    - name: Upload coverage to Codecov
      if: ${{ matrix.php == '8.4' }}
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
